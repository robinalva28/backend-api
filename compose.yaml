name: cocos-backend

services:
  app:
    build:
      context: .
      target: runtime
    init: true
    environment:
      NODE_ENV: production
      PORT: 3000
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: ${PGDATABASE:-cocos}
      PGUSER: ${PGUSER:-cocos}
      PGPASSWORD: ${PGPASSWORD:-cocos-local}
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "const socket = require('node:net').connect(3000, '127.0.0.1', () => { socket.end(); process.exit(0); }); socket.setTimeout(2000, () => process.exit(1)); socket.on('error', () => process.exit(1));"
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3

  db:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: ${PGDATABASE:-cocos}
      POSTGRES_USER: ${PGUSER:-cocos}
      POSTGRES_PASSWORD: ${PGPASSWORD:-cocos-local}
    ports:
      - "127.0.0.1:${PGPORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - type: bind
        source: ./database.sql
        target: /docker-entrypoint-initdb.d/001-database.sql
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 10

  db-test:
    image: postgres:18.6-bookworm
    profiles: [test]
    environment:
      POSTGRES_DB: cocos_test
      POSTGRES_USER: ${PGUSER:-cocos}
      POSTGRES_PASSWORD: ${PGPASSWORD:-cocos-local}
    ports:
      - "127.0.0.1:${PGTESTPORT:-5433}:5432"
    tmpfs:
      - /var/lib/postgresql
    volumes:
      - type: bind
        source: ./database.sql
        target: /docker-entrypoint-initdb.d/001-database.sql
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 10

volumes:
  postgres-data:
