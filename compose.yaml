name: backend-api

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-app-base: &app-base
  build:
    context: .
    target: runtime
  init: true
  ports:
    - "127.0.0.1:${PORT:-3000}:3000"
  healthcheck:
    test:
      - CMD
      - node
      - -e
      - "const socket = require('node:net').connect(3000, '127.0.0.1', () => { socket.end(); process.exit(0); }); socket.setTimeout(2000, () => process.exit(1)); socket.on('error', () => process.exit(1));"
    interval: 10s
    timeout: 3s
    start_period: 10s
    retries: 3
  logging: *default-logging

services:
  app:
    <<: *app-base
    environment:
      NODE_ENV: production
      PORT: 3000
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: ${PGDATABASE:-backend_api}
      PGUSER: ${PGUSER:-backend_api}
      PGPASSWORD: ${PGPASSWORD:-backend-api-local}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SLOW_REQUEST_THRESHOLD_MS: ${SLOW_REQUEST_THRESHOLD_MS:-1000}
    depends_on:
      db:
        condition: service_healthy

  app-remote:
    <<: *app-base
    profiles: [remote]
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:-}
      PGSSLROOTCERT: ${PGSSLROOTCERT:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SLOW_REQUEST_THRESHOLD_MS: ${SLOW_REQUEST_THRESHOLD_MS:-1000}

  db:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: ${PGDATABASE:-backend_api}
      POSTGRES_USER: ${PGUSER:-backend_api}
      POSTGRES_PASSWORD: ${PGPASSWORD:-backend-api-local}
    ports:
      - "127.0.0.1:${PGPORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - type: bind
        source: ./database.sql
        target: /docker-entrypoint-initdb.d/001-database.sql
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 10
    logging: *default-logging

  db-test:
    image: postgres:18.6-bookworm
    profiles: [test]
    environment:
      POSTGRES_DB: backend_api_test
      POSTGRES_USER: ${PGUSER:-backend_api}
      POSTGRES_PASSWORD: ${PGPASSWORD:-backend-api-local}
    ports:
      - "127.0.0.1:${PGTESTPORT:-5433}:5432"
    tmpfs:
      - /var/lib/postgresql
    volumes:
      - type: bind
        source: ./database.sql
        target: /docker-entrypoint-initdb.d/001-database.sql
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 10
    logging: *default-logging

volumes:
  postgres-data:
